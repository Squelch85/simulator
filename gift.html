<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>행운의 뽑기 시뮬레이터</title>
  <style>
    :root {
      --bg-color: #f4f4f4;
      --text-color: #000000;
      --container-bg: #ffffff;
      --border-color: #dddddd;
      --control-bg: #eeeeee;
      --control-hover: #dddddd;
      --th-bg: #f2f2f2;
      --shadow: rgba(0,0,0,0.1);
    }
    html.dark {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --container-bg: #1e1e1e;
      --border-color: #333333;
      --control-bg: #2c2c2c;
      --control-hover: #3a3a3a;
      --th-bg: #2c2c2c;
      --shadow: rgba(0,0,0,0.5);
    }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; background-color: var(--bg-color); color: var(--text-color); transition: background-color .3s, color .3s; }
    .container { width: 100%; max-width: 600px; margin: 20px; padding: 15px; background: var(--container-bg); border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); transition: background .3s; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 0.75rem; font-weight: bold; }
    h2 { font-size: 1.1rem; margin: 0.75rem 0 0.5rem; }
    p { line-height: 1.4; margin: 0.25rem 0; }
    section { margin-bottom: 1.25rem; }
    .theme-toggle { position: absolute; top: 10px; right: 10px; }
    .theme-btn { background: none; border: none; font-size: 1.5rem; filter: grayscale(100%); cursor: pointer; transition: filter .3s; color: var(--text-color); }
    footer { text-align:center; font-size:0.8rem; color: var(--text-color); margin-top:8px; }
    .theme-btn:hover { filter: grayscale(0%); }
    .controls { display: flex; gap: 4px; align-items: center; margin-bottom: 0.75rem; }
    .controls button { flex: 1; padding: 0.25rem; font-size: 0.9rem; font-weight: bold; border: 1px solid var(--border-color); border-radius: 4px; background: var(--control-bg); color: var(--text-color); cursor: pointer; transition: background .3s; }
    .controls button:hover { background: var(--control-hover); }
    .controls input { width: 80px; padding: 0.25rem; font-size: 0.9rem; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; background: var(--container-bg); color: var(--text-color); }
    #runBtn { width: 100%; padding: 0.5rem; font-size: 1rem; background-color: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 0.5rem; }
    #runBtn:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--border-color); padding: 0.25rem; text-align: center; font-weight: bold; font-size: 0.85rem; line-height: 1.2; }
    th { background-color: var(--th-bg); }
    .color-red    { color: #FF0000; }
    .color-yellow { color: #CCCC00; }
    .color-blue   { color: #0000FF; }
    .color-grey   { color: #808080; }
    @keyframes textBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .blink { animation: textBlink 1s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="theme-toggle">
    <button id="toggleTheme" class="theme-btn">🌙</button>
  </div>
  <div class="container">
    <a href="index.html">&larr; 홈으로</a>
    <h1>행운의 뽑기 시뮬레이터</h1>
    <div class="controls">
      <button data-delta="-100">-100</button>
      <button data-delta="-10">-10</button>
      <input type="number" id="trials" min="1" value="100">
      <button data-delta="10">+10</button>
      <button data-delta="100">+100</button>
    </div>
    <button id="runBtn">실행</button>
    <div id="results"></div>
  </div>
  <script>
    const toggleBtn = document.getElementById('toggleTheme');
    toggleBtn.addEventListener('click', () => document.documentElement.classList.toggle('dark'));

    const DRAW_ITEMS = [
      { name: '에아나드의 장신구 랜덤 상자 (귀속) 1개', rate: 0.0009 },
      { name: '에아나드의 장신구 랜덤 상자 II (귀속) 1개', rate: 0.0013 },
      { name: '에아나드의 방어구 랜덤 상자 (귀속) 1개', rate: 0.0013 },
      { name: '에아나드의 방어구 랜덤 상자 II (귀속) 1개', rate: 0.0023 },
      { name: '초승돌 4단계 선택 상자 (귀속) 1개', rate: 0.058 },
      { name: '호라의 탈것 조련술 교본 1개', rate: 0.13 },
      { name: '하르키니의 강화 주문서 선택 상자 1개', rate: 0.019 },
      { name: '전설 소환권 선택 상자 (귀속) 1개', rate: 0.11 },
      { name: '영웅 무기 환영 소환권 (1회) (귀속) 1개', rate: 0.4 },
      { name: '동대륙 주화 (귀속) 10개', rate: 11 },
      { name: '영롱한 소환권 (11회) 선택 상자 (귀속) 2개', rate: 16.5 },
      { name: '기록자의 인장 (귀속) 150개', rate: 13.5 },
      { name: '신비한 소환권 (11회) 선택 상자 (귀속) 5개', rate: 9 },
      { name: '눈부신 무기 환영 소환권 (11회) (귀속) 2개', rate: 24.2772 },
      { name: '10월 스페셜 럭키 박스 (귀속) 1개', rate: 25, isLuckyBox: true }
    ];

    const LUCKY_BOX_ITEMS = [
      { name: '에아나드의 장신구 랜덤 상자 II (귀속) 1개', rate: 0.001 },
      { name: '에아나드의 방어구 랜덤 상자 II (귀속) 1개', rate: 0.002 },
      { name: '고결한 이지의 방어구 선택 상자 1개', rate: 0.01 },
      { name: '호라 탈것 조련술 교본 1개', rate: 0.015 },
      { name: '영웅 무기 환영 소환권 선택 상자 (귀속) 1개', rate: 0.35 },
      { name: '호라의 마법부여석 선택 상자 (귀속) 1개', rate: 2 },
      { name: '전설 위상의 파편 (귀속) 1개', rate: 1.5 },
      { name: '영웅 위상의 파편 (귀속) 1개', rate: 5 },
      { name: '아키움 대형 상자 (귀속) 1개', rate: 1.5 },
      { name: '기록자의 인장 (귀속) 50개', rate: 39.622 },
      { name: '영롱한 소환권 (11회) 선택 상자 (귀속) 2개', rate: 25 },
      { name: '눈부신 무기 환영 소환권 (11회) (귀속) 1개', rate: 25 }
    ];

    const RARITY_THRESHOLDS = [0.01, 0.1, 1, 3, 10];
    const getRarity = rate => {
      for (let i = 0; i < RARITY_THRESHOLDS.length; i++) {
        if (rate <= RARITY_THRESHOLDS[i]) return 6 - i;
      }
      return 1;
    };

    const getColor = rate => (rate <= 1 ? 'yellow' : 'red');
    const addMetadata = data => {
      let acc = 0;
      return data.map(item => {
        acc += item.rate;
        return { ...item, threshold: acc / 100, rank: getRarity(item.rate), color: getColor(item.rate) };
      });
    };

    const DRAW_TABLE = addMetadata(DRAW_ITEMS);
    const LUCKY_TABLE = addMetadata(LUCKY_BOX_ITEMS);
    const BLINK_NAMES = DRAW_ITEMS.slice().sort((a, b) => a.rate - b.rate).slice(0, 3).map(item => item.name);

    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById('trials');
        input.value = Math.max(1, parseInt(input.value, 10) + Number(btn.dataset.delta));
      });
    });

    const runSimulation = (table, attempts, onHit) => {
      const results = table.map(item => ({ ...item, count: 0 }));
      for (let draw = 0; draw < attempts; draw++) {
        const roll = Math.random();
        for (const item of results) {
          if (roll <= item.threshold) {
            item.count++;
            if (onHit) onHit(item);
            break;
          }
        }
      }
      return results;
    };

    const renderTable = (data, attempts) => {
      const sorted = data.slice().sort((a, b) => ((b.count > 0) - (a.count > 0)) || (b.rank - a.rank));
      const rows = sorted.map(item => {
        const expected = (item.rate / 100 * attempts).toFixed(2);
        const blink = (BLINK_NAMES.includes(item.name) && item.count > 0) ? ' blink' : '';
        return `<tr>
          <td><span class="color-${item.color}${blink}">${item.name}</span></td>
          <td><span class="color-${item.color}${blink}">${expected}</span></td>
          <td><span class="color-${item.color}${blink}">${item.count}</span></td>
        </tr>`;
      }).join('');
      return `<table><thead><tr><th>아이템</th><th>기대수</th><th>획득수</th></tr></thead><tbody>${rows}</tbody></table>`;
    };

    document.getElementById('runBtn').addEventListener('click', () => {
      const trials = parseInt(document.getElementById('trials').value, 10);
      if (Number.isNaN(trials) || trials <= 0) return;

      let luckyBoxCount = 0;
      const primary = runSimulation(DRAW_TABLE, trials, item => {
        if (item.isLuckyBox) luckyBoxCount++;
      });
      const lucky = runSimulation(LUCKY_TABLE, luckyBoxCount);

      const primaryTable = renderTable(primary, trials);
      const luckyTable = luckyBoxCount ? renderTable(lucky, luckyBoxCount) : '';
      const luckyHeadline = luckyBoxCount ?
        `획득한 럭키 박스 ${luckyBoxCount.toLocaleString()}개 개봉 결과` :
        '아직 획득한 럭키 박스가 없습니다';

      const luckySection = luckyBoxCount
        ? luckyTable
        : '<p>행운의 뽑기에서 10월 스페셜 럭키 박스를 얻으면 개봉 결과가 표시됩니다.</p>';

      document.getElementById('results').innerHTML = `
        <section>
          <h2>행운의 뽑기 결과</h2>
          <p>총 ${trials.toLocaleString()}회 뽑기 중 10월 스페셜 럭키 박스를 ${luckyBoxCount.toLocaleString()}개 획득했습니다.</p>
          ${primaryTable}
        </section>
        <section>
          <h2>${luckyHeadline}</h2>
          ${luckySection}
        </section>
      `;
    });
  </script>
  <footer><small>버전 v1.3.32</small></footer>
</body>
</html>
