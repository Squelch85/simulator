<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>신년 행복 염원 상자 시뮬레이터</title>
  <style>
    :root {
      --bg-color: #f4f4f4;
      --text-color: #000000;
      --container-bg: #ffffff;
      --border-color: #dddddd;
      --control-bg: #eeeeee;
      --control-hover: #dddddd;
      --th-bg: #f2f2f2;
      --shadow: rgba(0,0,0,0.1);
    }
    html.dark {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --container-bg: #1e1e1e;
      --border-color: #333333;
      --control-bg: #2c2c2c;
      --control-hover: #3a3a3a;
      --th-bg: #2c2c2c;
      --shadow: rgba(0,0,0,0.5);
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color .3s, color .3s;
    }
    .container {
      width: 100%;
      max-width: 720px;
      margin: 20px;
      padding: 16px;
      background: var(--container-bg);
      border-radius: 8px;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background .3s;
    }
    h1 { text-align: center; font-size: 1.6rem; margin: 0.75rem 0 0.5rem; font-weight: bold; }
    h2 { font-size: 1.1rem; margin: 0.75rem 0 0.5rem; }
    p { line-height: 1.5; margin: 0.35rem 0; }
    section { margin-top: 1rem; }
    .theme-toggle { position: absolute; top: 10px; right: 10px; }
    .theme-btn { background: none; border: none; font-size: 1.5rem; filter: grayscale(100%); cursor: pointer; transition: filter .3s; color: var(--text-color); }
    .theme-btn:hover { filter: grayscale(0%); }
    .controls { display: flex; gap: 4px; align-items: center; margin: 0.75rem 0; flex-wrap: wrap; }
    .controls button { flex: 1; padding: 0.35rem; font-size: 0.9rem; font-weight: bold; border: 1px solid var(--border-color); border-radius: 4px; background: var(--control-bg); color: var(--text-color); cursor: pointer; transition: background .3s; min-width: 88px; }
    .controls button:hover { background: var(--control-hover); }
    .controls input, .controls select { padding: 0.35rem; font-size: 0.95rem; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; background: var(--container-bg); color: var(--text-color); }
    .controls select { min-width: 280px; text-align-last: left; }
    .controls input { width: 90px; }
    #runBtn { width: 100%; padding: 0.55rem; font-size: 1rem; background-color: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 0.75rem; }
    #runBtn:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--border-color); padding: 0.35rem; text-align: center; font-weight: bold; font-size: 0.9rem; line-height: 1.3; }
    th { background-color: var(--th-bg); }
    .note { font-size: 0.9rem; color: var(--text-color); }
    .muted { font-size: 0.85rem; color: #a0a0a0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .subtle-btn { padding: 0.35rem 0.55rem; font-size: 0.85rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--control-bg); color: var(--text-color); cursor: pointer; transition: background .3s, color .3s, border-color .3s; }
    .subtle-btn:hover { background: var(--control-hover); }
    .table-panel { margin-top: 0.5rem; }
    .table-panel[hidden] { display: none; }
    .rarity { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .rarity::before { content: '●'; font-size: 0.8rem; }
    .rarity.legendary { color: #ffd86b; text-shadow: 0 0 6px rgba(255, 216, 107, 0.65); animation: fadePulse 1.8s ease-in-out infinite; }
    .rarity.heroic { color: #ff6b6b; }
    .rarity.rare { color: #5aa6ff; }
    .rarity.common { color: #f1f1f1; text-shadow: 0 0 4px rgba(0, 0, 0, 0.55); }
    .rarity-text.legendary { color: #ffd86b; text-shadow: 0 0 6px rgba(255, 216, 107, 0.65); animation: fadePulse 1.8s ease-in-out infinite; }
    .rarity-text.heroic { color: #ff6b6b; }
    .rarity-text.rare { color: #5aa6ff; }
    .rarity-text.common { color: #f1f1f1; text-shadow: 0 0 4px rgba(0, 0, 0, 0.55); }
    @keyframes fadePulse {
      0% { opacity: 1; }
      50% { opacity: 0.55; }
      100% { opacity: 1; }
    }
    footer { text-align:center; font-size:0.8rem; color: var(--text-color); margin-top:8px; }
  </style>
</head>
<body>
  <div class="theme-toggle">
    <button id="toggleTheme" class="theme-btn">🌙</button>
  </div>
  <div class="container">
    <a href="index.html">&larr; 홈으로</a>
    <h1>신년 행복 염원 상자 시뮬레이터</h1>
    <p id="simulationDescription" class="note">신년 행복 염원 상자 (귀속) 및 웹상점 패키지에서 획득 가능한 보상과 확률을 그대로 반영했습니다.</p>
    <div class="controls" aria-label="시뮬레이션 선택 및 반복 설정">
      <select id="simulationSelect" aria-label="시뮬레이션 선택"></select>
      <button data-delta="-1000">-1000</button>
      <button data-delta="-100">-100</button>
      <button data-delta="-10">-10</button>
      <input type="number" id="trials" min="1" value="100">
      <button data-delta="10">+10</button>
      <button data-delta="100">+100</button>
      <button data-delta="1000">+1000</button>
    </div>
    <button id="runBtn">시뮬레이션 실행</button>
    <div class="muted">기본 시도 횟수는 100회로 설정되어 있습니다.</div>

    <section>
      <div class="section-header">
        <h2>기본 획득 확률</h2>
        <button id="toggleProbability" class="subtle-btn" aria-expanded="false">확률표 펼치기</button>
      </div>
      <div id="probabilityPanel" class="table-panel" hidden>
        <div class="muted">합계는 100%가 되도록 검증했습니다.</div>
        <table>
          <thead>
            <tr><th>등급</th><th>아이템</th><th>확률</th></tr>
          </thead>
          <tbody id="probabilityTable"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>시뮬레이션 결과</h2>
      <div id="results" class="muted">시뮬레이션을 실행하면 여기에서 기대값과 실제 획득 수를 비교할 수 있습니다.</div>
    </section>
  </div>
  <script>
    const toggleBtn = document.getElementById('toggleTheme');
    toggleBtn.addEventListener('click', () => document.documentElement.classList.toggle('dark'));

    const SIMULATIONS = [
      {
        id: 'newyear',
        label: '신년 행복 염원 상자 (귀속)',
        description: '신년 행복 염원 상자 (귀속) 및 웹상점 패키지에서 획득 가능한 보상과 확률을 그대로 반영했습니다.',
        items: [
          { name: '에아나드 장비 선택 상자 (귀속) 1개', rate: 0.0002 },
          { name: '에아나드의 보조 방어구 랜덤 상자 1개', rate: 0.0003 },
          { name: '하르키니의 강화 주문서 선택 상자 1개', rate: 0.01 },
          { name: '에아나드의 잉크 (전설) 1개', rate: 0.07 },
          { name: '전설 장비 선택 상자 1개', rate: 0.01 },
          { name: '봉인된 방어구 랜덤 상자 (귀속) 1개', rate: 0.15 },
          { name: '영웅 무기 환영 소환권 (1회) (귀속) 1개', rate: 0.4 },
          { name: '전설 소환권 선택 상자 (귀속) 1개', rate: 0.1 },
          { name: '호라의 마법부여석 선택 상자 (귀속) 1개', rate: 0.7 },
          { name: '전설 위상의 파편 (귀속) 1개', rate: 0.25 },
          { name: '영웅 위상의 파편 (귀속) 1개', rate: 1.5 },
          { name: '+5 장신구 선택 상자 (귀속) 1개', rate: 10 },
          { name: '아스티의 특별 소환권 (11회) 선택 상자 (귀속) 1개', rate: 0.75 },
          { name: '영롱한 소환권 (11회) 선택 상자 (귀속) 1개', rate: 28.5 },
          { name: '기록자의 인장 (귀속) 10,000개', rate: 0.003 },
          { name: '기록자의 인장 (귀속) 100개', rate: 16 },
          { name: '그릇된 자의 잔재 (귀속) 800개', rate: 12 },
          { name: '눈부신 무기 환영 소환권 (11회) (귀속) 1,000개', rate: 0.0003 },
          { name: '눈부신 무기 환영 소환권 (11회) (귀속) 5개', rate: 1 },
          { name: '눈부신 무기 환영 소환권 (11회) (귀속) 2개', rate: 28.5562 },
        ],
      },
      {
        id: 'specialSummon',
        label: '스페셜 소환권 랜덤 상자 (귀속)',
        description: '스페셜 소환권 랜덤 상자 (귀속) — 아듀 2025 패키지 구매 시 획득, 사용 시 획득 확률을 반영했습니다.',
        items: [
          { name: '영롱한 소환권 (11회) 선택 상자 (귀속) 100개', rate: 0.01 },
          { name: '영롱한 소환권 (11회) 선택 상자 (귀속) 10개', rate: 1 },
          { name: '영롱한 소환권 (11회) 선택 상자 (귀속) 2개', rate: 4 },
          { name: '영롱한 소환권 (11회) 선택 상자 (귀속) 1개', rate: 20 },
          { name: '눈부신 무기 환영 소환권 (11회) (귀속) 100개', rate: 0.01 },
          { name: '눈부신 무기 환영 소환권 (11회) (귀속) 10개', rate: 1 },
          { name: '눈부신 무기 환영 소환권 (11회) (귀속) 2개', rate: 4 },
          { name: '눈부신 무기 환영 소환권 (11회) (귀속) 1개', rate: 35 },
          { name: '지배자의 영롱한 탈것 소환권 (11회) (귀속) 100개', rate: 0.01 },
          { name: '지배자의 영롱한 탈것 소환권 (11회) (귀속) 10개', rate: 1 },
          { name: '지배자의 영롱한 탈것 소환권 (11회) (귀속) 2개', rate: 4 },
          { name: '지배자의 영롱한 탈것 소환권 (11회) (귀속) 1개', rate: 29.97 },
        ],
      },
    ];

    const rarityMeta = {
      legendary: { label: '전설', className: 'legendary' },
      heroic: { label: '영웅', className: 'heroic' },
      rare: { label: '희귀', className: 'rare' },
      common: { label: '일반', className: 'common' },
    };

    const rarityPriority = {
      legendary: 3,
      heroic: 2,
      rare: 1,
      common: 0,
    };

    const getRarityKey = (rate) => {
      if (rate < 0.01) return 'legendary';
      if (rate < 0.1) return 'heroic';
      if (rate < 1) return 'rare';
      return 'common';
    };

    const formatRate = (rate) => {
      if (rate >= 1) return `${rate.toFixed(4)}%`;
      if (rate >= 0.01) return `${rate.toFixed(4)}%`;
      return `${rate.toFixed(7)}%`;
    };

    const formatExpected = (value) => {
      if (value === 0) return '0';
      if (value < 0.01) return '매우희박';
      if (value < 1) return value.toFixed(4);
      return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
    };

    const formatCount = (count) => count.toLocaleString();

    const sortByAscendingRate = (items) =>
      [...items].sort((a, b) =>
        a.rate - b.rate ||
        a.name.localeCompare(b.name)
      );

    const decorateWithThreshold = (items) => {
      let cumulative = 0;
      return items.map(item => {
        cumulative += item.rate;
        return { ...item, threshold: cumulative / 100, rarity: getRarityKey(item.rate) };
      });
    };

    const buildTableData = (items) => decorateWithThreshold(sortByAscendingRate(items));

    const renderRarityBadge = (rarityKey) => {
      const { label, className } = rarityMeta[rarityKey];
      return `<span class="rarity ${className}">${label}</span>`;
    };

    const renderNameWithRarity = (item) => `<span class="rarity-text ${rarityMeta[item.rarity].className}">${item.name}</span>`;

    let tableData = buildTableData(SIMULATIONS[0].items);
    let activeSimulationId = SIMULATIONS[0].id;

    const renderProbabilityTable = () => {
      const tbody = document.getElementById('probabilityTable');
      const rows = tableData.map(item => (
        `<tr><td>${renderRarityBadge(item.rarity)}</td><td>${renderNameWithRarity(item)}</td><td>${formatRate(item.rate)}</td></tr>`
      )).join('');
      tbody.innerHTML = rows;
      const total = tableData.at(-1).threshold * 100;
      if (Math.abs(total - 100) > 0.0001) {
        tbody.insertAdjacentHTML('beforeend', `<tr><td colspan="3">⚠️ 합계 경고: ${total.toFixed(6)}%</td></tr>`);
      }
    };

    const simulate = (trials) => {
      const results = tableData.map(item => ({ ...item, count: 0 }));
      for (let i = 0; i < trials; i++) {
        const roll = Math.random();
        for (const item of results) {
          if (roll <= item.threshold) {
            item.count += 1;
            break;
          }
        }
      }
      return results;
    };

    const renderResults = (trials, results) => {
      const filtered = results.filter(item => item.count > 0);
      const sorted = filtered.sort((a, b) =>
        a.rate - b.rate ||
        b.count - a.count ||
        rarityPriority[b.rarity] - rarityPriority[a.rarity] ||
        a.name.localeCompare(b.name)
      );
      const rows = sorted.map(item => {
        const expected = formatExpected(item.rate / 100 * trials);
        const actualRate = trials ? `${(item.count / trials * 100).toFixed(4)}%` : '0%';
        return `<tr>
          <td>${renderRarityBadge(item.rarity)}</td>
          <td>${renderNameWithRarity(item)}</td>
          <td>${formatRate(item.rate)}</td>
          <td>${expected}</td>
          <td>${formatCount(item.count)}</td>
          <td>${actualRate}</td>
        </tr>`;
      }).join('');

      document.getElementById('results').innerHTML = `
        <p>총 <strong>${trials.toLocaleString()}</strong>회 개봉 결과입니다.</p>
        ${sorted.length ? `<table>
          <thead>
            <tr>
              <th>등급</th>
              <th>아이템</th>
              <th>기본 확률</th>
              <th>기대 수량</th>
              <th>획득 수량</th>
              <th>실측 비율</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>` : '<p>획득된 보상이 없습니다.</p>'}
      `;
    };

    const simulationSelect = document.getElementById('simulationSelect');
    SIMULATIONS.forEach(sim => {
      const option = document.createElement('option');
      option.value = sim.id;
      option.textContent = sim.label;
      simulationSelect.appendChild(option);
    });
    simulationSelect.value = activeSimulationId;

    const simulationDescription = document.getElementById('simulationDescription');
    const resetResultsMessage = () => {
      document.getElementById('results').textContent = '시뮬레이션을 실행하면 여기에서 기대값과 실제 획득 수를 비교할 수 있습니다.';
    };

    const applySimulation = (simulationId) => {
      const nextSimulation = SIMULATIONS.find(sim => sim.id === simulationId) || SIMULATIONS[0];
      activeSimulationId = nextSimulation.id;
      tableData = buildTableData(nextSimulation.items);
      simulationDescription.textContent = nextSimulation.description;
      simulationSelect.value = activeSimulationId;
      resetResultsMessage();
      renderProbabilityTable();
    };

    simulationSelect.addEventListener('change', (event) => {
      applySimulation(event.target.value);
    });

    document.querySelectorAll('.controls button').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById('trials');
        const next = Math.max(1, parseInt(input.value, 10) + Number(button.dataset.delta));
        input.value = next;
      });
    });

    const probabilityPanel = document.getElementById('probabilityPanel');
    const toggleProbability = document.getElementById('toggleProbability');
    toggleProbability.addEventListener('click', () => {
      const isHidden = probabilityPanel.hasAttribute('hidden');
      if (isHidden) {
        probabilityPanel.removeAttribute('hidden');
        toggleProbability.textContent = '확률표 접기';
        toggleProbability.setAttribute('aria-expanded', 'true');
      } else {
        probabilityPanel.setAttribute('hidden', '');
        toggleProbability.textContent = '확률표 펼치기';
        toggleProbability.setAttribute('aria-expanded', 'false');
      }
    });

    document.getElementById('runBtn').addEventListener('click', () => {
      const trials = parseInt(document.getElementById('trials').value, 10);
      if (Number.isNaN(trials) || trials < 1) return;
      const results = simulate(trials);
      renderResults(trials, results);
    });

    resetResultsMessage();
    renderProbabilityTable();
  </script>
  <footer><small>버전 v1.3.37 - 시뮬레이션 선택 추가 및 확률 오름차순 정렬 일괄 적용</small></footer>
</body>
</html>
